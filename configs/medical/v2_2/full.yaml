program:
  name: med_circuitbench_v2_2
  date: 2026-07-14

dataset:
  n_samples: 10000
  sequence_length: 42
  observed_window: 36
  window: 36
  prediction_horizon: 6
  horizon: 6
  target_threshold: 0.0715
  infection_prevalence: 0.25
  infection_impulse_strength: 3.0

split:
  train: 0.60
  validation: 0.20
  test: 0.20

model:
  input_dim: 27
  d_model: 128
  latent_dim: 128
  layers: 4
  transformer_layers: 4
  heads: 4
  transformer_heads: 4
  d_ffn: 512
  transformer_ffn: 512
  dropout: 0.1

training:
  batch_size: 128
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.01
  min_epochs: 10
  max_epochs: 50
  concept_epochs: 50
  patience: 8
  restore_best_checkpoint: true

seeds: [42, 43, 44]

fan:
  lambda_c: 2.0
  lambda_a: 0.05
  lambda_s: 0.01
  memberships: [gaussian, bell, sigmoid, mixed]

shortcut:
  subsets:
    - observations_only
    - masks_only
    - delta_only
    - treatments_only
    - observations_masks
    - observations_treatments
    - full_input

sctc:
  minimum_training_episodes: 2000
  feature_grid: [128, 256, 512]
  training_epochs: 6
  top_features: 16
  random_null: 1000

