program:
  name: conceptfan_physionet2012_last_run
  source_commit: e60d9a3da40fc05b66874f89ad61015d6e07d33c
  split_seed: 20260717

data:
  set_a_zip: data/physionet2012/raw/set-a.zip
  outcomes: data/physionet2012/raw/Outcomes-a.txt
  outcomes_url: https://physionet.org/files/challenge-2012/1.0.0/Outcomes-a.txt
  expected_patients: 4000
  hours: 48
  minimum_train_patient_coverage: 0.01
  clip_quantiles: [0.005, 0.995]
  split:
    train: 0.60
    validation: 0.15
    calibration: 0.10
    test: 0.15

concepts:
  names:
    - hemodynamic_instability
    - respiratory_dysfunction
    - renal_dysfunction
    - neurological_dysfunction
    - metabolic_inflammatory_dysregulation
  aggregation: top2_mean
  definitions:
    hemodynamic_instability:
      low: [MAP, NIMAP, SysABP, NISysABP, DiasABP, NIDiasABP]
      high: [HR, Lactate]
    respiratory_dysfunction:
      low: [PaO2, SaO2, PFratio]
      high: [RespRate]
      binary: [MechVent]
    renal_dysfunction:
      high: [Creatinine, BUN]
      low: [Urine6h]
    neurological_dysfunction:
      low: [GCS]
    metabolic_inflammatory_dysregulation:
      two_sided: [pH, Glucose, Temp, WBC, Platelets, Na, K]
      low: [HCO3]

model:
  sequence_length: 48
  latent_dim: 128
  layers: 4
  heads: 4
  ffn: 512
  dropout: 0.1
  n_concepts: 5

training:
  init_seeds: [11, 23, 37, 41, 53, 67, 79, 83, 97, 109]
  data_order_seeds: [1001, 2003, 3007]
  leakage_init_seeds: [11, 23, 37, 41, 53, 67, 79, 83, 97, 109]
  leakage_data_order_seed: 1001
  batch_size: 128
  learning_rate: 0.0001
  weight_decay: 0.01
  max_epochs: 50
  min_epochs: 10
  patience: 8
  gradient_clip: 1.0
  lambda_concept: 1.0
  concept_loss: masked_smooth_l1
  max_retries: 2

stability_regularization:
  lambda_stab_grid: [0.01, 0.03, 0.1, 0.3]
  lambda_logit_grid: [0.0, 0.01]
  warmup_epochs: 5
  ramp_epochs: 5
  auprc_noninferiority_margin: 0.01

calibration:
  primary_selection_metric: calibration_nll
  ece_bins: [10, 15, 20]

robustness:
  gaussian_noise: [0.05, 0.10, 0.20]
  outliers: [0.01, 0.05]
  mcar: [0.10, 0.20, 0.30]
  block_missing: [6, 12]
  sensor_bias: [-0.25, 0.25]

statistics:
  bootstrap_repetitions: 2000
  hierarchical_bootstrap_repetitions: 1000
  confidence_level: 0.95
